[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hotnews-agent"
version = "0.1.0"
description = "Personal Feishu group news subscriptions with Codex research and a localhost manager"
requires-python = ">=3.8"
dependencies = ["cryptography>=2.8"]

[project.scripts]
hotnews = "hotnews.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hotnews.admin" = ["static/*.html", "static/*.js", "static/*.css"]
